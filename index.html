<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aditya AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial;min-height:100vh}
header{text-align:center;color:#ffd700;font-size:20px;font-weight:bold;padding:12px}
#chat{padding:10px 12px 75px;max-width:800px;margin:auto}
.msg{padding:10px 13px;margin:7px 0;border-radius:12px;line-height:1.4}
.user{background:#252525;text-align:right}
.bot{background:#191919}
.warning{background:#332b00;color:#ffd700;border:1px solid #ffd700;text-align:center;font-size:14px}
#box{position:fixed;bottom:0;left:0;width:100%;background:#111;padding:8px;display:flex;gap:7px}
#question{flex:1;padding:12px;border:1px solid #555;border-radius:25px;background:#222;color:#fff;outline:none}
button{width:48px;height:48px;border:0;border-radius:50%;background:#ffd700;font-size:23px;cursor:pointer}
</style>
</head>
<body>

<header>Powered by Aditya Sir</header>

<div id="chat"></div>

<div id="box">
<input id="question" placeholder="Ask anything..." autocomplete="off">
<button onclick="ask()">⌕</button>
</div>

<script>
const input=document.getElementById("question");
const chat=document.getElementById("chat");

function add(text,type){
  const d=document.createElement("div");
  d.className="msg "+type;
  d.innerHTML=text
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/\*\*(.*?)\*\*/g,"<b>$1</b>")
  .replace(/\n/g,"<br>");
  chat.appendChild(d);
  window.scrollTo(0,document.body.scrollHeight);
}

async function ask(){
  const q=input.value.trim();
  if(!q)return;

  add(q,"user");
  input.value="";

  try{
    const r=await fetch("/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})
    });

    const data=await r.json();

    if(data.warning){
      add(data.answer,"warning");
    }else{
      add(data.answer,"bot");
    }
  }catch(e){
    add("Sorry, something went wrong.","bot");
  }
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter")ask();
});
</script>

</body>
</html>
